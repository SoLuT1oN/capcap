name: Sync Upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge, test, and update main
    runs-on: macos-latest
    steps:
      - name: Checkout private main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Test release synchronization
        run: python3 -B scripts/test_sync_upstream_release.py

      - name: Check and merge official release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/sync_upstream_release.py

      - name: Build
        if: steps.upstream.outputs.changed == 'true'
        run: swift build

      - name: Run full test suite
        if: steps.upstream.outputs.changed == 'true'
        run: swift test

      - name: Guard AI Calendar integration
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          test -f capcap/AICalendar/AICalendarService.swift
          test -f capcap/AICalendar/CalendarEventService.swift
          test -f capcap/AICalendar/AICalendarConfig.swift
          grep -q 'case aiCalendar' capcap/Editor/ToolbarLayout.swift
          grep -q 'case \.aiCalendar' capcap/Editor/EditWindowController.swift
          grep -q 'settingsTabAICalendar' capcap/Utilities/Defaults.swift
          swift test --filter 'AICalendar|CalendarEventService|ToolbarLayoutTests'

      - name: Build universal release binary
        if: steps.upstream.outputs.changed == 'true'
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Push tested merge to private main
        if: steps.upstream.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Start private release
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-ai.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Summarize update
        if: steps.upstream.outputs.changed == 'true'
        run: |
          {
            echo
            echo "Builds and tests passed"
            echo "Private main updated to \`$(git rev-parse --short HEAD)\`"
            echo "Private release workflow dispatched"
          } >> "$GITHUB_STEP_SUMMARY"
